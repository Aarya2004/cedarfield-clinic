name: ci
# Runs only when code changes; docs-only commits do not trigger it. Superseded runs are cancelled.
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci.yml'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - run: pnpm --filter rokan-terminal check
      - run: pnpm --filter rokan-sandbox check
      # real PTY on Linux (zsh for shell integration) + MCP relay over stdio
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: pnpm --filter rokan-terminal smoke
      # standalone unit tests not covered by smoke: trailer parser (native marker) + MCP relay
      - run: pnpm --filter rokan-terminal test
      # eval runner leaves no orphaned web/bridge processes
      - run: node --test evals/test/runner-cleanup.test.mjs
